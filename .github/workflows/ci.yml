name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - name: Test (race detector)
        run: go test -race ./...
      - run: make build
      - name: Self-check examples
        run: |
          ./bin/k8s-guardian check -f examples/secure-deployment.yaml
          if ./bin/k8s-guardian check -f examples/insecure-deployment.yaml; then
            echo "expected findings for the insecure example"; exit 1
          fi
          ./bin/k8s-guardian rule validate examples/rules
          ./bin/k8s-guardian cost -f examples/costly-app.yaml
          ./bin/kubectl-guard version
          kubectl kustomize examples/kustomize/overlays/prod >/dev/null
          ./bin/k8s-guardian check -k examples/kustomize/overlays/prod --fail-on info --skip KG003,KG005,KG006,KG007,KG008,KG009,KG013,KG014 --format github

  # Runs against a real kube-apiserver + etcd (envtest binaries): live
  # checks, diff and exported ValidatingAdmissionPolicies, comparing every
  # admission decision with the in-process engine.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kube-apiserver and etcd (envtest)
        env:
          GOTOOLCHAIN: auto
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest use -p path)" >> "$GITHUB_ENV"
      - name: Install Kyverno CLI and Prometheus
        env:
          KYVERNO_VERSION: v1.19.1
          PROMETHEUS_VERSION: 3.15.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar xz -C "$RUNNER_TEMP/bin" kyverno
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/prometheus" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: e2e tests
        run: go test -tags e2e -count=1 -v ./test/e2e/

  # Exercises the GitHub Action defined in action.yml.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Secure manifest passes
        id: secure
        uses: ./
        with:
          path: examples/secure-deployment.yaml
          cost: "true"
      - name: Insecure manifest fails with annotations
        id: insecure
        continue-on-error: true
        uses: ./
        with:
          path: examples/insecure-deployment.yaml examples/costly-app.yaml
          rules: examples/rules
          sarif-file: k8s-guardian.sarif
      - name: Verify outcomes
        env:
          SECURE_ERRORS: ${{ steps.secure.outputs.errors }}
          INSECURE_OUTCOME: ${{ steps.insecure.outcome }}
          INSECURE_ERRORS: ${{ steps.insecure.outputs.errors }}
        run: |
          test "$SECURE_ERRORS" = "0"
          test "$INSECURE_OUTCOME" = "failure"
          test "$INSECURE_ERRORS" -gt 0
          jq -e '.runs[0].results | length > 0' k8s-guardian.sarif
