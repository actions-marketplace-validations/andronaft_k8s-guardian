# Krew plugin manifest template, rendered by krew-release-bot on each release
# (see .github/workflows/release.yml). To submit manually, replace the
# templates with real URLs/sha256 values and open a PR against
# https://github.com/kubernetes-sigs/krew-index (plugins/guard-workloads.yaml).
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: guard-workloads
spec:
  version: {{ .TagName }}
  homepage: https://github.com/andronaft/k8s-guardian
  shortDescription: Audit and auto-fix workloads against guardrails
  description: |
    guard-workloads audits Kubernetes manifests, Helm charts, Kustomize
    overlays and live cluster resources for missing resource requests and
    limits, root containers, privilege escalation, missing probes, mutable
    image tags, host namespaces and more. It fixes what is safe to fix
    automatically while keeping YAML comments, checks whether a manifest
    fits the target cluster (quotas, node capacity, LimitRanges, missing
    ConfigMaps/Secrets) and flags breaking changes against what is deployed.
  caveats: |
    Checking local files works offline. Some features need extra setup:
      * --live, audit and diff read the cluster of your current kubeconfig
        (read-only, via kubectl).
      * --ai and "rule create" call the Anthropic API and need
        ANTHROPIC_API_KEY. Secrets are never sent.
      * cost --usage needs metrics-server or Prometheus (--prometheus URL).
  platforms:
    - selector:
        matchLabels: {os: linux, arch: amd64}
      {{addURIAndSha "https://github.com/andronaft/k8s-guardian/releases/download/{{ .TagName }}/kubectl-guard_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
      bin: kubectl-guard
    - selector:
        matchLabels: {os: linux, arch: arm64}
      {{addURIAndSha "https://github.com/andronaft/k8s-guardian/releases/download/{{ .TagName }}/kubectl-guard_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
      bin: kubectl-guard
    - selector:
        matchLabels: {os: darwin, arch: amd64}
      {{addURIAndSha "https://github.com/andronaft/k8s-guardian/releases/download/{{ .TagName }}/kubectl-guard_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
      bin: kubectl-guard
    - selector:
        matchLabels: {os: darwin, arch: arm64}
      {{addURIAndSha "https://github.com/andronaft/k8s-guardian/releases/download/{{ .TagName }}/kubectl-guard_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
      bin: kubectl-guard
    - selector:
        matchLabels: {os: windows, arch: amd64}
      {{addURIAndSha "https://github.com/andronaft/k8s-guardian/releases/download/{{ .TagName }}/kubectl-guard_{{ .TagName }}_windows_amd64.zip" .TagName }}
      bin: kubectl-guard.exe
    - selector:
        matchLabels: {os: windows, arch: arm64}
      {{addURIAndSha "https://github.com/andronaft/k8s-guardian/releases/download/{{ .TagName }}/kubectl-guard_{{ .TagName }}_windows_arm64.zip" .TagName }}
      bin: kubectl-guard.exe
