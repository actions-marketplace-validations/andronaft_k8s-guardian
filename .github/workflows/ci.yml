name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build
      - name: Self-check examples
        run: |
          ./bin/k8s-guardian check -f examples/secure-deployment.yaml
          ! ./bin/k8s-guardian check -f examples/insecure-deployment.yaml
          ./bin/k8s-guardian rule validate examples/rules
          ./bin/k8s-guardian cost -f examples/costly-app.yaml
