name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Opens a PR updating the plugin in kubernetes-sigs/krew-index. The very
      # first submission of .krew.yaml has to be done by hand, so don't fail
      # the release before that.
      - uses: rajatjindal/krew-release-bot@v0.0.46
        continue-on-error: true
