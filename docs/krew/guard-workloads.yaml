      uri: https://github.com/andronaft/k8s-guardian/releases/download/v0.7.0/kubectl-guard_v0.7.0_linux_arm64.tar.gz
      sha256: 6b98426d7545a6a59d9636fa7223bcfda94a35fa997556369c26d511cab8ad14
      bin: kubectl-guard
    - selector:
        matchLabels:
