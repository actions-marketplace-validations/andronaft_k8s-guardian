name: k8s-guardian Kubernetes Guardrails
description: Validate K8s manifests & Helm charts for security, resources, probes, and live cluster fit with inline PR annotations.
author: andronaft
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Files, directories or Helm charts to check (whitespace separated).
    required: false
    default: "."
  fail-on:
    description: Fail when findings at or above this severity remain (error, warning, info).
    required: false
    default: error
  skip:
    description: Comma separated rule IDs or names to skip, e.g. "KG006,KG015".
    required: false
    default: ""
  rules:
    description: Custom rule files or directories (whitespace separated). .k8s-guardian/rules is loaded automatically.
    required: false
    default: ""
  live:
    description: Also validate against the cluster of the current kubeconfig (quotas, node capacity, LimitRanges, missing references, CRDs). Requires cluster credentials in the job.
    required: false
    default: "false"
  namespace:
    description: Namespace for objects without one (used with live).
    required: false
    default: ""
  sarif-file:
    description: Also write a SARIF report to this path (upload it with github/codeql-action/upload-sarif).
    required: false
    default: ""
  cost:
    description: Add a monthly cost estimate of the workloads to the job summary.
    required: false
    default: "false"
  args:
    description: Extra arguments passed to `k8s-guardian check`.
    required: false
    default: ""
  new-only:
    description: Report only findings the pull request adds. The same paths are checked on the base branch first, and its findings are treated as a baseline. Without a base branch (not a pull request), everything is reported.
    required: false
    default: "false"
  base-ref:
    description: Branch the new-only mode compares with.
    required: false
    default: ${{ github.base_ref }}

outputs:
  errors:
    description: Number of error findings.
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: Number of warning findings.
    value: ${{ steps.check.outputs.warnings }}
  infos:
    description: Number of info findings.
    value: ${{ steps.check.outputs.infos }}
  fixable:
    description: Number of findings that `k8s-guardian check --fix` can fix automatically.
    value: ${{ steps.check.outputs.fixable }}
  sarif-file:
    description: Path of the SARIF report (when sarif-file is set).
    value: ${{ steps.check.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Detect Go
      id: go
      shell: bash
      run: |
        if command -v go >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

    - name: Set up Go
      if: steps.go.outputs.present != 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build k8s-guardian
      shell: bash
      env:
        GOTOOLCHAIN: auto
        GOFLAGS: -mod=readonly
      run: |
        ext=""
        if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
        cd "$GITHUB_ACTION_PATH" || exit 1
        go build -o "$RUNNER_TEMP/k8s-guardian-bin/k8s-guardian$ext" ./cmd/k8s-guardian
        echo "$RUNNER_TEMP/k8s-guardian-bin" >> "$GITHUB_PATH"

    - name: Run k8s-guardian
      id: check
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_LIVE: ${{ inputs.live }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_COST: ${{ inputs.cost }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_NEW_ONLY: ${{ inputs.new-only }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -uo pipefail
        paths=()
        for p in $INPUT_PATH; do
          # new-only compares findings across two checkouts, so paths inside
          # the working directory must be relative in both.
          if [ "$INPUT_NEW_ONLY" = "true" ]; then
            if [ "$p" = "$PWD" ]; then p=.; else p="${p#"$PWD"/}"; fi
          fi
          paths+=("$p")
        done
        files=()
        for p in "${paths[@]}"; do files+=(-f "$p"); done
        ruleargs=()
        if [ -n "$INPUT_SKIP" ]; then ruleargs+=(--skip "$INPUT_SKIP"); fi
        for r in $INPUT_RULES; do ruleargs+=(--rules "$r"); done
        args=("${ruleargs[@]}")
        if [ "$INPUT_LIVE" = "true" ]; then args+=(--live); fi
        if [ -n "$INPUT_NAMESPACE" ]; then args+=(-n "$INPUT_NAMESPACE"); fi
        # shellcheck disable=SC2206 # extra args are intentionally word-split
        extra=($INPUT_ARGS)

        if [ "$INPUT_NEW_ONLY" = "true" ]; then
          if [ -z "$INPUT_BASE_REF" ]; then
            echo "::notice::new-only: no base branch (not a pull request), reporting all findings"
          else
            # Check the same paths on the base branch; what it finds is not new.
            # Unique directories, so the action can run more than once a job.
            tmp=$(mktemp -d "$RUNNER_TEMP/k8s-guardian-base.XXXXXX")
            base="$tmp/tree" known="$tmp/known.json"
            prefix=$(git rev-parse --show-prefix 2>/dev/null)
            if git fetch --quiet --no-tags --depth=1 origin "$INPUT_BASE_REF" &&
              git worktree add --quiet --detach "$base" FETCH_HEAD; then
              # Only paths that exist there: one added by the pull request
              # has nothing to compare with, so all its findings are new. An
              # absolute path outside the repository can't be compared.
              basefiles=()
              for p in "${paths[@]}"; do
                case "$p" in /*) continue ;; esac
                if [ -e "$base/$prefix$p" ]; then basefiles+=(-f "$p"); fi
              done
              if [ ${#basefiles[@]} -eq 0 ]; then
                echo "The checked paths don't exist on $INPUT_BASE_REF: every finding is new."
              elif (cd "$base/$prefix" && k8s-guardian check "${basefiles[@]}" "${ruleargs[@]}" "${extra[@]}" --update-baseline --baseline "$known" > /dev/null); then
                args+=(--baseline "$known")
                echo "Reporting only findings that are not on $INPUT_BASE_REF."
              else
                echo "::warning::new-only: could not check $INPUT_BASE_REF, reporting all findings"
              fi
              git worktree remove --force "$base" || true
            else
              echo "::warning::new-only: could not fetch $INPUT_BASE_REF, reporting all findings"
            fi
          fi
        fi

        if [ -n "$INPUT_SARIF_FILE" ]; then
          k8s-guardian check "${files[@]}" "${args[@]}" "${extra[@]}" --format sarif --fail-on info > "$INPUT_SARIF_FILE" || true
          echo "sarif-file=$INPUT_SARIF_FILE" >> "$GITHUB_OUTPUT"
        fi

        code=0
        k8s-guardian check "${files[@]}" "${args[@]}" "${extra[@]}" --format github --fail-on "$INPUT_FAIL_ON" || code=$?

        if [ "$INPUT_COST" = "true" ]; then
          {
            echo "### 💰 Estimated monthly cost"
            echo '```text'
            k8s-guardian cost "${files[@]}" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$code"
