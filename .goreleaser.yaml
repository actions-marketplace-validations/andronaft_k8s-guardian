version: 2
project_name: k8s-guardian

builds:
  - id: k8s-guardian
    main: ./cmd/k8s-guardian
    binary: k8s-guardian
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  # Same program under the kubectl plugin name, used by the Krew package.
  - id: kubectl-guard
    main: ./cmd/k8s-guardian
    binary: kubectl-guard
    env: [CGO_ENABLED=0]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: k8s-guardian
    ids: [k8s-guardian]
    name_template: "k8s-guardian_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
  - id: kubectl-guard
    ids: [kubectl-guard]
    # Uses the tag (e.g. v0.3.0) so .krew.yaml can build URLs from {{ .TagName }}.
    name_template: "kubectl-guard_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  abbrev: 7
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  header: |
    ## Install

    ```bash
    # Binary: download the archive for your platform below, or
    go install github.com/andronaft/k8s-guardian/cmd/k8s-guardian@{{ .Tag }}

    # Docker
    docker run --rm -v "$PWD:/work" ghcr.io/andronaft/k8s-guardian:{{ .Version }} check -f .

    # GitHub Action
    #   - uses: andronaft/k8s-guardian@{{ .Tag }}
    ```

    `kubectl-guard_*` archives contain the kubectl plugin (`kubectl guard ...`).
